version: '3'
services:
  web:
    image: srfsc_flask
    build: .
    env_file:
      - .env # This file is optional; defaults will be used if it does not exist
    ports:
      - "8490:8490"
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

  socketio:
    image: srfsc_socket
    build: ./socket
    ports:
      - "8491:8491"
    restart: unless-stopped

  code_runner:
    image: srfsc_runner
    build: ./runner
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    restart: unless-stopped
