version: '3'
services:
  web:
    image: flask_open
    build: .
    env_file:
      - .env # Required; provide a private SECRET_KEY for production startup
    ports:
      - "8490:8587"
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

  socketio:
    image: socket_open
    build: ./socket
    ports:
      - "8491:8500"
    restart: unless-stopped

  code_runner:
    image: flask_runner
    build: ./runner
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    restart: unless-stopped
